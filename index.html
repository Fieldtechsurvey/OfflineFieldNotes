<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123c52"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Offline Field Recorder</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#183242;background:#eef3f6}*{box-sizing:border-box}body{margin:0}header{background:#123c52;color:white;padding:22px 18px}header h1{font-size:1.35rem;margin:0 0 7px}header p{margin:0;color:#d4e8ef;font-size:.87rem}main{max-width:600px;margin:auto;padding:16px}.panel{background:white;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px #173b4d13}h2{font-size:1.05rem;margin:0 0 14px}label{font-size:.89rem;font-weight:650;display:block;margin:12px 0 5px}input,select,textarea{font:inherit;width:100%;padding:12px;border:1px solid #bccbd2;border-radius:9px;background:#fff;color:#173647}textarea{min-height:80px;resize:vertical}button{font:inherit;border:0;padding:12px 14px;border-radius:10px;background:#17647d;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#e1eef2;color:#174256}button.danger{background:#fff1f1;color:#a32626}button:disabled{opacity:.45;cursor:default}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.status{min-height:1.6em;font-size:.9rem;margin:12px 0 0;color:#28576d}.record{border-top:1px solid #e4ebee;padding:12px 0}.record:first-child{border-top:0}.record small{color:#526b79;display:block;margin-top:3px}.record button{font-size:.78rem;padding:7px 9px;margin-top:6px}.muted{color:#526b79;font-size:.85rem}#count{font-variant-numeric:tabular-nums}footer{text-align:center;color:#617984;font-size:.78rem;padding:8px 20px 32px}
</style>
</head>
<body><header><h1>Field Data Recorder</h1><p>Capture data offline · Export CSV for RStudio</p></header>
<main>
<section class="panel"><h2>New record</h2><form id="form">
<label for="location">Location / site</label><input id="location" required maxlength="120" placeholder="e.g. Site A">
<label for="measurement">Measurement</label><input id="measurement" type="number" step="any" required placeholder="e.g. 12.5">
<label for="notes">Notes</label><textarea id="notes" maxlength="5000" placeholder="Optional observations"></textarea>
<div class="actions"><button type="submit" id="save">Save record offline</button><button type="reset" class="secondary">Clear form</button></div></form><p id="status" class="status" role="status" aria-live="polite"></p></section>
<section class="panel"><h2>Saved records (<span id="count">0</span>)</h2><div class="actions"><button type="button" id="export" class="secondary">Export CSV</button><button type="button" id="deleteall" class="danger">Delete all records</button></div><p class="muted">Export regularly and keep a separate backup. Records stay on this device unless you export them.</p><div id="records"></div></section>
</main><footer>Offline Field Recorder · Your data is stored in this browser's local database.</footer>
<script>
'use strict';
const DB_NAME='offline-field-recorder', STORE='records';
const $=id=>document.getElementById(id);
let db;
function openDb(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
function txn(mode,action){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,mode),store=tx.objectStore(STORE);let result;try{const request=action(store);if(request){request.onsuccess=()=>{result=request.result;};request.onerror=()=>reject(request.error);}}catch(e){reject(e);return;}tx.oncomplete=()=>resolve(result);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);});}
function allRecords(){return txn('readonly',s=>s.getAll());}
function csvCell(x){const v=String(x??'');return '"'+v.replaceAll('"','""')+'"';}
function status(s){$('status').textContent=s;}
async function render(){const records=(await allRecords()).sort((a,b)=>b.created.localeCompare(a.created));$('count').textContent=records.length;const root=$('records');root.replaceChildren();if(!records.length){const p=document.createElement('p');p.className='muted';p.textContent='No saved records yet.';root.append(p);return;}for(const r of records){const div=document.createElement('div');div.className='record';const title=document.createElement('strong');title.textContent=r.location+' · '+r.measurement;const detail=document.createElement('small');detail.textContent=new Date(r.created).toLocaleString()+(r.notes?' · '+r.notes:'');const btn=document.createElement('button');btn.type='button';btn.className='danger';btn.textContent='Delete';btn.addEventListener('click',async()=>{if(!confirm('Delete this record?'))return;try{await txn('readwrite',s=>s.delete(r.id));await render();status('Record deleted.');}catch(e){status('Could not delete: '+e.message);}});div.append(title,detail,btn);root.append(div);}}
$('form').addEventListener('submit',async e=>{e.preventDefault();const location=$('location').value.trim(),measurement=$('measurement').value.trim(),notes=$('notes').value.trim();if(!location||!measurement||!Number.isFinite(Number(measurement))){status('Enter a location and valid measurement.');return;}const record={id:crypto.randomUUID(),created:new Date().toISOString(),location,measurement:Number(measurement),notes};$('save').disabled=true;try{await txn('readwrite',s=>s.put(record));$('form').reset();await render();status('Record saved on this phone.');}catch(err){status('SAVE FAILED: '+err.message);}finally{$('save').disabled=false;}});
$('export').addEventListener('click',async()=>{try{const records=(await allRecords()).sort((a,b)=>a.created.localeCompare(b.created));if(!records.length){status('Nothing to export.');return;}const fields=['id','created','location','measurement','notes'];const csv='\uFEFF'+fields.join(',')+'\r\n'+records.map(r=>fields.map(f=>csvCell(r[f])).join(',')).join('\r\n')+'\r\n';const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='field_records_'+new Date().toISOString().slice(0,10)+'.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);status('CSV prepared. Save or share the downloaded file from your phone.');}catch(err){status('Export failed: '+err.message);}});
$('deleteall').addEventListener('click',async()=>{if(!confirm('PERMANENTLY delete ALL records? Export a CSV backup first.'))return;if(!confirm('Confirm: delete every stored record?'))return;try{await txn('readwrite',s=>s.clear());await render();status('All records deleted.');}catch(e){status('Delete failed: '+e.message);}});
(async()=>{if(!('indexedDB'in window)){status('This browser does not support local database storage.');$('save').disabled=true;return;}try{db=await openDb();await render();status('Local storage ready.');if('storage'in navigator&&navigator.storage.persist){navigator.storage.persist().catch(()=>{});}}catch(e){status('Cannot access local storage: '+e.message);$('save').disabled=true;}})();
if('serviceWorker'in navigator && (location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('Offline setup:',e)));}
</script></body></html>
